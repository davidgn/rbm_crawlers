inebreak\",\"version\":1,\"format\":\"\",\"indent\":0,\"detail\":0},{\"type\":\"linebreak\",\"version\":1,\"format\":\"\",\"indent\":0,\"detail\":0},{\"direction\":\"ltr\",\"text\":\"\\\"จิตวิทยาและพฤติกรรมมนุษย์\\\"\",\"type\":\"text\",\"mode\":\"normal\",\"format\":1,\"version\":1,\"indent\":0,\"detail\":0},{\"direction\":\"ltr\",\"text\":\" เป็นคู่มือที่มอบแนวทางที่ชัดเจนและเข้าถึงได้ เพื่อทำความเข้าใจแนวคิดสำคัญของวิทยาศาสตร์ทางจิตวิทยา กระบวนการทางจิต และพฤติกรรม หนังสือที่จะทำให้แนวคิดทางจิตวิทยาที่ซับซ้อนนั้นง่ายต่อการเข้าใจ และนำไปใช้ได้จริงในชีวิตประจำวัน สิ่งที่คุณจะเรียนรู้ อาทิ จิตวิทยาในชีวิตประจำวัน กรณีศึกษาในการวิจัยทางจิตวิทยา ระบบประสาท สารสื่อประสาท ฮอร์โมนในพฤติกรรมมนุษย์ กระบวนการทางปัญญาและหน่วยความจำ พัฒนาการของจิตวิทยาตั้งแต่เด็กจนถึงผู้ใหญ่ทั้งทางสังคมและอารมณ์รวมทั้งปัจจัยที่ส่งผลต่อบุคลิกภาพ   ปัจจัยทางจิตวิทยาในด้านสุขภาพและความเจ็บป่วย และอีกมากมาย\",\"type\":\"text\",\"mode\":\"normal\",\"format\":0,\"version\":1,\"indent\":0,\"detail\":0},{\"type\":\"linebreak\",\"version\":1,\"format\":\"\",\"indent\":0,\"detail\":0},{\"type\":\"linebreak\",\"version\":1,\"format\":\"\",\"indent\":0,\"detail\":0},{\"direction\":\"ltr\",\"text\":\"    ไม่ว่าคุณจะเป็นนักเรียนในระดับชั้นใด ๆ (มัธยมศึกษาตอนปลาย วิทยาลัย) ผู้เชี่ยวชาญในสาขาอื่น หรือเพียงแค่ผู้ที่ชื่นชอบจิตใจมนุษย์ หนังสือเล่มนี้ได้รับการออกแบบมาเพื่อให้คุณได้รับข้อมูลเชิงลึกอันมีค่าเกี่ยวกับวิธีที่เราคิด รู้สึก และกระทำ ซึ่งครอบคลุมทุกแง่มุมของจิตวิทยา ช่วยให้คุณมีรากฐานที่มั่นคงในการทำความเข้าใจธรรมชาติของมนุษย์\",\"type\":\"text\",\"mode\":\"normal\",\"format\":0,\"version\":1,\"indent\":0,\"detail\":0}]},{\"direction\":\"ltr\",\"tag\":\"p\",\"type\":\"paragraph\",\"textFormat\":0,\"version\":1,\"format\":\"\",\"indent\":0,\"detail\":0,\"children\":[]},{\"direction\":\"ltr\",\"tag\":\"p\",\"type\":\"paragraph\",\"textFormat\":0,\"version\":1,\"format\":\"\",\"indent\":0,\"detail\":0,\"children\":[{\"type\":\"linebreak\",\"version\":1,\"format\":\"\",\"indent\":0,\"detail\":0}]},{\"direct
