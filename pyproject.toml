[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "data",
    "src/cache",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".hypothesis",
    ".venv",
    "data",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = [
    "data",
]
