name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Lint maintained crawler and test surface
        run: |
          ruff check \
            src/ai_extractor.py \
            src/carousell_ph_spider.py \
            src/kingstone_spider.py \
            tests \
            scripts/ci_offline_smoke.py
      - name: Compile maintained crawler and test surface
        run: |
          python -m py_compile \
            src/ai_extractor.py \
            src/carousell_ph_spider.py \
            src/kingstone_spider.py \
            scripts/ci_offline_smoke.py
      - name: Run tests
        run: pytest -q tests
      - name: Run offline smoke
        run: python scripts/ci_offline_smoke.py
