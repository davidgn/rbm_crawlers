name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Lint codebase
        run: |
          ruff check src tests scripts
      - name: Compile codebase
        run: |
          python -m py_compile $(find src tests scripts -name "*.py")
      - name: Type check (advisory)
        run: |
          mypy src tests scripts --ignore-missing-imports || true
      - name: Run tests
        run: pytest -q tests
      - name: Run offline smoke
        run: python scripts/ci_offline_smoke.py
